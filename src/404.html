<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // Redirect case-variant URLs to lowercase
        const path = window.location.pathname;
        
        // Check if this is an items page request
        if (path.match(/^\/items\//i)) {
            // Convert to lowercase
            const lowerPath = path.toLowerCase();
            
            // Only redirect if it's different (prevents infinite loop)
            if (lowerPath !== path) {
                window.location.href = lowerPath + window.location.search;
            } else {
                // Still not found, show 404
                document.body.innerHTML = '<h1>404 - Item Not Found</h1><p><a href="/">Back to Home</a></p>';
            }
        } else {
            // Not an item page, show generic 404
            document.body.innerHTML = '<h1>404 - Page Not Found</h1><p><a href="/">Back to Home</a></p>';
        }
    </script>
</body>
</html>
