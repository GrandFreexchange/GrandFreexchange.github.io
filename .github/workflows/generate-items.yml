name: Generate OSRS Item Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'dev.html'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/generate-items.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# A newer push rebuilds everything anyway, so an older run still going would only fail its push
concurrency:
  group: generate-items
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate item pages
        run: node build.js
        timeout-minutes: 30

      - name: Check for changes
        id: check_changes
        # git status also sees brand-new item pages, which git diff misses
        run: |
          if [ -z "$(git status --porcelain items/ guides/ sitemap.xml all_items.html)" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push generated files
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A items/ guides/ sitemap.xml all_items.html
          git commit -m "chore: regenerate OSRS item pages [skip ci]"
          git push

      # Tell Bing (IndexNow) which pages this run changed. Waits for GitHub Pages to publish them first.
      - name: Submit changed pages to IndexNow
        if: steps.check_changes.outputs.changes == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sleep 90
          node indexnow.js HEAD~1 HEAD
